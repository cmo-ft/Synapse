# Three event classes, five object predictions and four shared-parent matrices.
model: synapse.models.ParticleTransformer.ParticleTransformerSimple
model_params:
  input_dim: 10
  global_input_dim: 35
  num_classes: 3
  num_obj_classes: 5
  lepton_jet_hf:
    jet_tag_indices: [8, 9]  # tagQuantile, tagAvailable
    use_event_context: true  # Feed the HF-weighted jet context into the event classifier.
  shared_parent_rank: 16  # Components per object and parent in the shared-parent head.
  shared_parent_feedback: true
  pair_input_dim: 4
  use_pre_activation_pair: false
  embed_dims: [32, 128, 32]
  global_embed_dims: [32, 128, 32]
  pair_embed_dims: [16, 16, 16]
  num_heads: 4
  num_layers: 5  # Blocks 1–4 predict the matrices. Block 5 uses them in attention.
  num_cls_layers: 1
  fc_params: [[128, 0], [64, 0], [32, 0]]
  trim: false

output_names: [p_signal, p_bkg, p_extconv_bkg]
binary_object_output_names: [p_lepton_higgs, p_lepton_top, p_lepton_wzvv, p_lepton_conversion, p_lepton_hf]
# Exclude a pair if either object has any listed flag. Use [] to include every valid object.
shared_parent_veto_features: [isMET]
# Each entry pairs a training truth branch with its output score. The order defines the matrix channels.
shared_parent_outputs:
  relationHiggs: p_pair_higgs
  relationTop: p_pair_top
  relationW: p_pair_w
  relationZ: p_pair_z
loss_function:
  name: synapse.loss_functions.lepton_objects.EventAndLeptonObjectLoss
  params:
    mean_train_weight: auto
    origin_loss_weight: 0.10
    conversion_loss_weight: 0.10
    heavy_flavour_weight: 0.08
    shared_parent_loss_weight: 0.02  # Per parent, matching 0.10 / 5 in the matrix run.
    balance_origin_classes: true
optimizer: Adam
start_lr: 0.001
lr_scheduler: cosine
metrics:
  Accuracy:
    function: synapse.core.metrics.weighted_accuracy
    stages: [val, test]
    on_epoch: true
  AUC:
    function: synapse.core.metrics.weighted_auc
    stages: [val, test]
    on_epoch: true
  CM:
    function: synapse.core.metrics.weighted_confusion_matrix
    stages: [val, test]
    on_epoch: true
