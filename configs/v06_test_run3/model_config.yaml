# Three event classes and five binary object predictions.
model: synapse.models.ParticleTransformer.ParticleTransformerSimple
model_params:
  input_dim: 10
  global_input_dim: 35
  num_classes: 3
  num_obj_classes: 5
  lepton_jet_hf:
    jet_tag_indices: [8, 9]  # tagQuantile, tagAvailable
    use_event_context: true  # Feed the HF-weighted jet context into the event classifier.
  pair_input_dim: 4
  use_pre_activation_pair: false
  embed_dims: [32, 128, 32]
  global_embed_dims: [32, 128, 32]
  pair_embed_dims: [16, 16, 16]
  num_heads: 4
  num_layers: 4
  num_cls_layers: 1
  fc_params: [[128, 0], [64, 0], [32, 0]]
  trim: false

output_names: [p_signal, p_bkg, p_extconv_bkg]
binary_object_output_names: [p_lepton_higgs, p_lepton_top, p_lepton_wzvv, p_lepton_conversion, p_lepton_hf]
loss_function:
  name: synapse.loss_functions.lepton_objects.EventAndLeptonObjectLoss
  params:
    mean_train_weight: auto
    origin_loss_weight: 0.10
    conversion_loss_weight: 0.10
    heavy_flavour_weight: 0.08
    balance_origin_classes: true
optimizer: Adam
start_lr: 0.001
lr_scheduler: cosine
metrics:
  Accuracy:
    function: synapse.core.metrics.weighted_accuracy
    stages: [val, test]
    on_epoch: true
  AUC:
    function: synapse.core.metrics.weighted_auc
    stages: [val, test]
    on_epoch: true
  CM:
    function: synapse.core.metrics.weighted_confusion_matrix
    stages: [val, test]
    on_epoch: true
